{% extends "tasks/base.html" %}
{% block content %}
<div class="row">
    <div class="col-lg-6">
        <div class="card shadow">
            <div class="card-header">
                Görev Ekle
            </div>
            <div class="card-body">

        <form method="POST"
            {%if edit_task %}
                action= "{% url 'edit' edit_task.id %}"
             {% endif %}>
        {% csrf_token %}

        <div class="mb-3">
            <label> Başlık</label>
            <input           
                type="text"
                name="title"
                class="form-control"
                value="{{ edit_task.title|default:'' }}">
        </div>
        <div class="mb-3">
            <label>Açıklama</label>
            <textarea     
                name="description"
                class="form-control">
                {{ edit_task.description|default:'' }}
            </textarea>
        </div>
    <label>
        <input
            type="checkbox"
            name="completed"
            {% if edit_task.completed %}checked{% endif %}>
            Tamamlandı
    </label>
<button type="submit"
class="btn btn-success btn-block">
    {% if edit_task %}
    Güncelle
    {% else %}
    Görev Ekle
    {% endif %}
</button>
</form>
</div>
</div>
</div>
<div class="col-lg-6">
    <div class ="card shadow">
        <div class=" card-header">
            Görev Listesi
        </div>
        <div class="card-body p-3">
<ul class="list-group">
    {% for task in tasks %}

    <li class="list-group-item d-flex justify-content-between align-items-center">
        {{task.title}}
        <div>
            <a href="{% url 'edit' task.id %}"
            class="btn btn-warning btn-sm">
                Düzenle
            </a>

            <form method="POST"
                action="{% url 'delete' task.id %}"
                style="display:inline;">
                {%csrf_token%}

                <button type="submit"
                class="btn btn-danger btn-sm">
                    sil 
                </button>
            </form>
        </div>

    </li>
    {% endfor %}
</ul>
</div>
</div>
</div>
</div>
</div>
{% endblock %}
